<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form</title>

<style>
    body{
        margin:0;
        font-family: Arial, sans-serif;
        background:#000;
        color:#fff;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .form-container{
        background:#111;
        padding:30px;
        width: 400px;
        border:2px solid #b8860b;
        border-radius:10px;
        box-shadow:0 0 15px rgba(184,134,11,0.5);
    }

    h2{
        text-align:center;
        color:#b8860b;
        margin-bottom:20px;
    }

    label{
        font-size:14px;
        color:#b8860b;
        font-weight:bold;
    }

    input, textarea{
        width:100%;
        padding:12px;
        margin:8px 0 18px 0;
        border:1px solid #b8860b;
        border-radius:5px;
        background:#000;
        color:#fff;
    }

    button{
        width:100%;
        padding:13px;
        background:#b8860b;
        border:none;
        border-radius:5px;
        font-size:16px;
        font-weight:bold;
        color:#000;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#d4a441;
    }

    .message{
        text-align:center;
        margin-top:15px;
        color:#b8860b;
        font-weight:bold;
    }
     .button{
        margin-left: 40px;
        border: 1px solid blue;
        background-color: blue;
        color: aliceblue;
        width: 200px;
        display: flex;
         
        justify-content: center;
        border-radius: 30px;
        transition: all 1s ease-in-out;
    }
    .button:hover{
    background-color: black;
        color: aliceblue;
        
    }
</style>
</head>
<body>

<div class="form-container">
    <h2>Contact Us</h2>

    <form id="contactForm">
        <label>Name</label>
        <input type="text" name="Name" required>

        <label>Email</label>
        <input type="email" name="Email" required>

        <label>Phone</label>
        <input type="text" name="Phone">

        <label>Message</label>
        <textarea name="Message" rows="4" required></textarea>

        <button type="submit">Submit</button>
        
        <div class="message" id="formMsg"></div>
          <a href="index.html">
         <div class="button">
    <p> Back to home </p>
   </div>
     </a>
    </form>
</div>
    
  

<script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbwNgchey8sQjZki3lxO-9p_8_nEc9nISN1h2ALb6yC-LBQ7Jd4KvZvUsuJRvYlmZG2lsw/exec";
    const form = document.getElementById("contactForm");
    const msg = document.getElementById("formMsg");

    form.addEventListener("submit", e => {
        e.preventDefault();
        msg.innerHTML = "Submitting...";

        fetch(scriptURL, { method: "POST", body: new FormData(form)})
        .then(() => {
            msg.innerHTML = "Submitted Successfully!";
            form.reset();
        })
        .catch(() => {
            msg.innerHTML = "Error! Try again.";
        });
    });
</script>

</body>
</html>
