<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentorship Application Form</title>

<style>
    body{
        margin:0;
        font-family: Arial, sans-serif;
        background:#000;
        color:#fff;
        display:flex;
        justify-content:center;
        padding:50px 0;
    }

    .form-box{
        background:#111;
        width:500px;
        padding:30px;
        border-radius:15px;
        border:2px solid #b8860b;
        box-shadow:0 0 20px rgba(184,134,11,0.5);
    }

    h2{
        text-align:center;
        color:#b8860b;
        margin-bottom:20px;
        font-size:26px;
        font-weight:bold;
    }

    label{
        color:#b8860b;
        font-weight:bold;
        margin-top:10px;
        display:block;
    }

    input, select, textarea{
        width:100%;
        padding:12px;
        margin:8px 0 20px 0;
        border:1px solid #b8860b;
        border-radius:7px;
        background:#000;
        color:#fff;
    }

    button{
        width:100%;
        padding:14px;
        background:#b8860b;
        color:#000;
        font-size:18px;
        font-weight:bold;
        border:none;
        border-radius:7px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#d4a441;
    }

    .response{
        text-align:center;
        margin-top:15px;
        color:#b8860b;
        font-weight:bold;
    }
     .button{
        margin-left: 40px;
        border: 1px solid blue;
        background-color: blue;
        color: aliceblue;
        width: 200px;
        display: flex;
         margin-left:60px;
        justify-content: center;
        border-radius: 30px;
        transition: all 1s ease-in-out;
    }
    .button:hover{
    background-color: black;
        color: aliceblue;
        
    }
</style>
</head>
<body>

<div class="form-box">
    <h2>Mentorship Application</h2>

    <form id="mentorForm">
        <label>Full Name</label>
        <input type="text" name="Full Name" required>

        <label>Email</label>
        <input type="email" name="Email" required>

        <label>Phone Number</label>
        <input type="text" name="Phone Number" required>

        <label>Type of Mentorship</label>
        <select name="Mentorship Type" required>
            <option value="">-- Select Option --</option>
            <option value="Career Coaching">Career Coaching</option>
            <option value="Health Coaching">Health Coaching</option>
            <option value="Men Mentoring">Men Mentoring</option>
        </select>

        <label>Why do you want this mentorship?</label>
        <textarea name="Reason" rows="4" required></textarea>

        <label>Your Current Challenge</label>
        <textarea name="Challenge" rows="4"></textarea>

        <button type="submit">Submit</button>

        <div class="response" id="mentorMsg"></div>
          <a href="index.html">
         <div class="button">
    <p> Back to home </p>
   </div>
     </a>
    </form>
</div>
     </div>
   

<script>
    const scriptURL_Mentor = "https://script.google.com/macros/s/AKfycbzopvpuBTBywAlKP72AxCZpuiOq-7r0IY9hZcgi4xAOTu4f8Mv2ykTPSpCf7mhOR94q8w/exec";
    const mentorForm = document.getElementById("mentorForm");
    const mentorMsg = document.getElementById("mentorMsg");

    mentorForm.addEventListener("submit", e => {
        e.preventDefault();
        mentorMsg.innerHTML = "Submitting...";

        fetch(scriptURL_Mentor, { 
            method: "POST", 
            body: new FormData(mentorForm)
        })
        .then(() => {
            mentorMsg.innerHTML = "Submitted Successfully!";
            mentorForm.reset();
        })
        .catch(() => {
            mentorMsg.innerHTML = "Error! Try again.";
        });
    });
</script>

</body>
</html>
